<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lagon des Nombres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sea-deep:   #073B4C;
    --sea-mid:    #0E5E68;
    --lagoon:     #1EACA8;
    --sand:       #FFF3D6;
    --coral:      #FF6B6B;
    --sun:        #FFC44D;
    --leaf:       #06D6A0;
    --ink:        #06303E;
    --paper:      #FDFBF3;
    --card:       #FFFFFF;
    --card-line:  rgba(6,48,62,0.10);
    --text-main:  var(--ink);
    --text-soft:  rgba(6,48,62,0.62);
    --shadow-lg:  0 18px 40px rgba(6,48,62,0.18);
    --shadow-sm:  0 6px 14px rgba(6,48,62,0.12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #062832;
      --card: #0C3B48;
      --card-line: rgba(255,255,255,0.10);
      --text-main: #F2FBFA;
      --text-soft: rgba(242,251,250,0.68);
      --sand: #12454F;
      --shadow-lg: 0 18px 40px rgba(0,0,0,0.45);
      --shadow-sm: 0 6px 14px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #062832;
    --card: #0C3B48;
    --card-line: rgba(255,255,255,0.10);
    --text-main: #F2FBFA;
    --text-soft: rgba(242,251,250,0.68);
    --sand: #12454F;
    --shadow-lg: 0 18px 40px rgba(0,0,0,0.45);
    --shadow-sm: 0 6px 14px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,196,77,0.20), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(255,107,107,0.16), transparent 42%),
      linear-gradient(180deg, var(--sea-deep) 0%, var(--sea-mid) 55%, var(--lagoon) 100%);
    color: var(--text-main);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  .bg-scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: url('/assets/bg-lagon.jpg') center / cover no-repeat, linear-gradient(180deg, var(--sea-deep) 0%, var(--lagoon) 100%);
    pointer-events: none;
  }
  .fish-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .fish{position:absolute;left:0;font-size:var(--sz,36px);opacity:.85;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));will-change:transform;animation:swimR var(--d,22s) linear infinite;animation-delay:var(--dl,0s)}
  .fish.l{animation-name:swimL}
  .fish span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .fish.r span{transform:scaleX(-1)}
  @keyframes swimR{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
  @keyframes swimL{from{transform:translateX(115vw)}to{transform:translateX(-15vw)}}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:14px}}
  @media (prefers-reduced-motion:reduce){.fish{animation:none;display:none}}
  .bg-scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(7,59,76,0.42) 0%, rgba(7,59,76,0.10) 38%, rgba(30,172,168,0.16) 72%, rgba(7,59,76,0.34) 100%);
  }
  .waves {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 120px;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }
  .bubbles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .bubble {
    position: absolute;
    bottom: -60px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.65), rgba(255,255,255,0.06) 70%);
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.5; }
    to { transform: translateY(-115vh) translateX(var(--drift, 20px)); opacity: 0; }
  }

  /* ---------- shell / header ---------- */
  header.appbar {
    position: sticky;
    top: 0;
    padding: calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    background: linear-gradient(180deg, rgba(7,59,76,0.92), rgba(7,59,76,0.0));
    backdrop-filter: blur(6px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    transform: rotate(-6deg);
  }
  .brand-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #FDFBF3;
    letter-spacing: 0.2px;
  }
  .hud {
    display: flex;
    gap: 10px;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(253,251,243,0.14);
    border: 1px solid rgba(253,251,243,0.28);
    color: #FDFBF3;
    padding: 7px 12px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    font-family: 'Baloo 2', sans-serif;
  }
  .sound-toggle {
    cursor: pointer;
    font-size: 16px;
    padding: 7px 11px;
  }
  .sound-toggle:hover { background: rgba(253,251,243,0.24); }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 8px 18px 48px;
    position: relative;
    z-index: 5;
  }
  .stage {
    width: 100%;
    max-width: 640px;
  }

  /* ---------- menu screen ---------- */
  .hero {
    text-align: center;
    color: #FDFBF3;
    padding: 18px 6px 22px;
  }
  .hero h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 8px;
    line-height: 1.1;
  }
  .hero p {
    margin: 0;
    color: rgba(253,251,243,0.78);
    font-size: 16px;
    max-width: 46ch;
    margin-inline: auto;
  }
  .settings-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
  }
  .chip-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .settings-label {
    font-size: 13px;
    font-weight: 800;
    color: rgba(253,251,243,0.6);
    font-family: 'Baloo 2', sans-serif;
    margin-right: 2px;
  }
  .chip {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: #FDFBF3;
    background: rgba(253,251,243,0.10);
    border: 1px solid rgba(253,251,243,0.26);
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .chip:hover { background: rgba(253,251,243,0.2); }
  .chip:active { transform: scale(0.96); }
  .chip.active {
    background: linear-gradient(150deg, var(--sun), var(--coral));
    border-color: transparent;
    color: #06303E;
  }
  .chrono-chip.active { background: linear-gradient(150deg, var(--leaf), var(--lagoon)); color: #06303E; }

  .daily-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 640px;
    margin: 22px auto 6px;
    padding: 16px 18px;
    border-radius: 22px;
    border: 1px solid rgba(255,196,77,0.5);
    background: linear-gradient(120deg, rgba(255,196,77,0.24), rgba(255,107,107,0.18));
    color: #FDFBF3;
    text-align: left;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: var(--shadow-sm);
  }
  .daily-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .daily-card:active { transform: translateY(0); }
  .daily-card.done { opacity: 0.75; }
  .daily-icon {
    font-size: 30px;
    flex-shrink: 0;
    width: 52px; height: 52px;
    border-radius: 16px;
    background: rgba(253,251,243,0.18);
    display: flex; align-items: center; justify-content: center;
  }
  .daily-text { flex: 1; min-width: 0; }
  .daily-text h3 {
    font-family: 'Baloo 2', sans-serif;
    margin: 0 0 3px;
    font-size: 17px;
  }
  .daily-text p {
    margin: 0;
    font-size: 13px;
    color: rgba(253,251,243,0.8);
  }
  .daily-status {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 20px;
  }
  @media (max-width: 460px) {
    .mode-grid { grid-template-columns: 1fr; }
  }
  .mode-card {
    position: relative;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 22px;
    padding: 18px 16px;
    text-align: left;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
  }
  .mode-card::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-18deg);
    transition: left .55s ease;
    pointer-events: none;
  }
  .mode-card:hover::after { left: 130%; }
  .mode-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .mode-card:active { transform: translateY(0px) scale(0.99); }
  .mode-icon {
    width: 52px; height: 52px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .mode-card h3 {
    font-family: 'Baloo 2', sans-serif;
    margin: 0;
    font-size: 18px;
  }
  .mode-card p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-soft);
    line-height: 1.4;
  }

.pp-msg{min-height:1.4em;color:#ffd9a0}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pp-kpi{background:#ffffff1f;border-radius:14px;padding:12px;text-align:center}.pp-kpi b{display:block;font-size:26px}.pp-kpi span{font-size:13px;opacity:.85}
.pp-tips{padding-left:20px;line-height:1.6}
.pp-bars{display:flex;gap:8px;align-items:flex-end;height:170px}.pp-day{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pp-col{width:100%;max-width:46px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;background:#ffffff14;border-radius:8px;overflow:hidden}
.pp-ok{background:#3ddc97}.pp-ko{background:#ff7a7a}.pp-legend{font-size:13px}.pp-lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 10px}.pp-lg.ok{background:#3ddc97}.pp-lg.ko{background:#ff7a7a}
.pp-cat{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;margin:6px 0}.pp-track{background:#ffffff22;border-radius:8px;height:12px;overflow:hidden}.pp-fill{background:#3ddc97;height:100%}
.pp-table{width:100%;border-collapse:collapse;margin-top:8px}.pp-table td,.pp-table th{padding:6px;border-bottom:1px solid #fff3;text-align:left}
.pp-actions{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px}.pp-note{font-size:12px;opacity:.75}
.parent-link{text-align:center;margin:18px 0}
@media print{body{background:#fff!important}.pp{color:#000}.pp-kpi,.pp-col,.pp-track{background:#eee}.pp-noprint,#i18nBtn,#i18nBox,header,.topbar{display:none!important}}
</style>
<style>
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:16px}
.pk-card{background:#ffffff26;border:2px solid #fff4;border-radius:20px;padding:18px 8px;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.pk-card:hover{background:#ffffff3a}.pk-av{font-size:48px}.pk-card b{font-size:20px}
.who{text-align:center;margin:6px 0;font-weight:700}

.pf{display:grid;gap:12px;max-width:340px;margin:14px 0}.pf label{display:grid;gap:4px;font-weight:700}

  function loadProgressFor(pid){
    var fallback = { totalCorrect: 0, bestStreakEver: 0, modesPlayed: {}, threeStarRounds: 0, unlocked: {}, dailyCompletedDates: {}, days: {}, modeLevel: {}, maxLevel: 0 };
    try {

      var parsed = JSON.parse(raw);
      return {

        modesPlayed: parsed.modesPlayed || {},

  function updateProgressAfterAnswer(isCorrect){
    if (isCorrect) progress.totalCorrect += 1;
    if (state.streak > progress.bestStreakEver) progress.bestStreakEver = state.streak;
    if (state.mode) progress.modesPlayed[state.mode] = true;
    checkBadges();
    saveProgress(progress);
  }
  function updateProgressAfterRound(starCount){
    if (starCount >= 3) progress.threeStarRounds += 1;
    if (state.mode === 'daily') progress.dailyCompletedDates[todayKey()] = true;
    checkBadges();
    saveProgress(progress);
  }

    BADGES.forEach(function(b){
      if (!progress.unlocked[b.id] && b.check(progress)){
        progress.unlocked[b.id] = true;
        newlyUnlocked.push(b);
      }
    });
  }
  var audioCtx = null;
  function getCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainPeak){
    var ctx = getCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.18, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.02);
  }

  function shapeSvg(shapeId, color){
    var inner = '';
    if (shapeId === 'circle') inner = '<circle cx="60" cy="60" r="46" fill="' + color + '"/>';
    else if (shapeId === 'square') inner = '<rect x="16" y="16" width="88" height="88" rx="10" fill="' + color + '"/>';
    else if (shapeId === 'rectangle') inner = '<rect x="8" y="30" width="104" height="60" rx="10" fill="' + color + '"/>';
    else if (shapeId === 'triangle') inner = '<polygon points="60,12 108,102 12,102" fill="' + color + '"/>';
    else if (shapeId === 'star') inner = '<polygon points="60,8 74,44 112,44 81,66 93,104 60,80 27,104 39,66 8,44 46,44" fill="' + color + '"/>';
    else if (shapeId === 'heart') inner = '<path d="M60 100 C 10 66 14 26 40 20 C 54 17 60 32 60 32 C 60 32 66 17 80 20 C 106 26 110 66 60 100 Z" fill="' + color + '"/>';
    return '<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }

  function clockSvg(hour, minute){
    var cx = 60, cy = 60, r = 52;
    var hourAngle = ((hour % 12) * 30 + minute * 0.5) - 90;
    var minuteAngle = (minute * 6) - 90;
    function handPoint(angleDeg, length){
      var rad = angleDeg * Math.PI / 180;
      return { x: cx + Math.cos(rad) * length, y: cy + Math.sin(rad) * length };
    }
    var hp = handPoint(hourAngle, r * 0.5);
    var mp = handPoint(minuteAngle, r * 0.78);
    var ticks = '';
    for (var i = 0; i < 12; i++){
      var a = (i * 30 - 90) * Math.PI / 180;
      var innerR = (i % 3 === 0) ? r - 12 : r - 7;
      var x1 = cx + Math.cos(a) * (r - 5);
      var y1 = cy + Math.sin(a) * (r - 5);
      var x2 = cx + Math.cos(a) * innerR;
      var y2 = cy + Math.sin(a) * innerR;
      ticks += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#06303E" stroke-width="' + (i % 3 === 0 ? 3 : 1.6) + '" stroke-linecap="round" opacity="0.55"/>';
    }
    return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#FFF3D6" stroke="#1EACA8" stroke-width="4"/>' +
      ticks +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + hp.x + '" y2="' + hp.y + '" stroke="#06303E" stroke-width="6" stroke-linecap="round"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + mp.x + '" y2="' + mp.y + '" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#06303E"/>' +
      '</svg>';
  }

  function rand(min, max){ return Math.floor(randomSource() * (max - min + 1)) + min; }
  var randomSource = Math.random;
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function dailySeed(){
    var d = new Date();

        if (namePool.indexOf(otherName) === -1) namePool.push(otherName);
      }
      return {
        kind:'shapes', shapeId:shape.id, color:color, answer:shape.name,
        choices:shuffle(namePool),
        label:'Quelle est cette forme ?'
      };
    }
    if (mode === 'neighbor'){
      var nBase = rand(1, Math.max(2, mx));
      var askAfter = rand(0, 1) === 1;
      if (nBase <= 0) askAfter = true;
      var nAnswer = askAfter ? nBase + 1 : nBase - 1;
      var choicesNeighbor = buildNumberChoices(nAnswer, 0, mx + 2);
      return {
        kind:'neighbor', base:nBase, askAfter:askAfter, answer:nAnswer, choices:choicesNeighbor,
        label: askAfter ? 'Quel nombre vient juste après ?' : 'Quel nombre vient juste avant ?'
      };
    }
    if (mode === 'maketen'){
      var tenTarget = tier([10, 10, 20, 20, 50]);
      var tenPart = rand(0, tenTarget);
      var tenMissing = tenTarget - tenPart;
      var choicesTen = buildNumberChoices(tenMissing, 0, tenTarget);
      return {
        kind:'maketen', part:tenPart, target:tenTarget, answer:tenMissing, choices:choicesTen,
        label:'Quel nombre complète pour atteindre ' + tenTarget + ' ?'
      };
    }
    if (mode === 'add3'){
      var mx3 = tier([3, 4, 5, 6, 8]);
      var a3 = rand(1, mx3), b3 = rand(1, mx3), c3 = rand(1, mx3);
      var sum3 = a3 + b3 + c3;
      var set3b = pickSet();
      var choices3b = buildNumberChoices(sum3, 1, mx3 * 3 + 5);
      return {
        kind:'add3', a:a3, b:b3, c:c3, answer:sum3, set:set3b, choices:choices3b,
        label:'Combien cela fait-il en tout ?'
      };
    }
    if (mode === 'divide'){
      var divisor = rand(2, tier([2, 3, 3, 4, 5]));
      var quotient = rand(2, tier([3, 4, 5, 6, 8]));
      var totalItems = divisor * quotient;
      var setDiv = pickSet();
      var choicesDiv = buildNumberChoices(quotient, 1, 20);
      return {
        kind:'divide', answer:quotient, divisor:divisor, quotient:quotient, total:totalItems, set:setDiv, choices:choicesDiv,
        label:'Combien y aura-t-il dans chaque groupe ?'
      };
    }
    if (mode === 'parity'){
      var pn = rand(1, Math.max(6, mx));
      var isEven = (pn % 2 === 0);
      var setPar = pickSet();
      return {
        kind:'parity', n:pn, set:setPar, answer:(isEven ? 'Pair' : 'Impair'),
        choices:['Pair', 'Impair'],
        label:'Ce nombre est-il pair ou impair ?'
      };
    }
    if (mode === 'money'){
      var moneyValues = tier([[1, 2], [1, 2], [1, 2, 5], [1, 2, 5, 10], [1, 2, 5, 10, 20]]);
      var itemCount = rand(2, tier([3, 3, 4, 5, 6]));
      var picked = [];
      var total = 0;
      for (var mi = 0; mi < itemCount; mi++){
        var v = moneyValues[rand(0, moneyValues.length - 1)];
        picked.push(v);
        total += v;
      }
      var choicesMoney = buildNumberChoices(total, 1, total + 15);
      return {
        kind:'money', items:picked, answer:total, choices:choicesMoney,
        label:'Combien y a-t-il en tout ?'
      };
    }
    if (mode === 'clock'){
      var hour = rand(1, 12);
      var minuteChoices = tier([[0], [0], [0, 30], [0, 30, 15], [0, 15, 30, 45]]);
      var minute = minuteChoices[rand(0, minuteChoices.length - 1)];
      var correctLabel = hour + 'h' + (minute === 0 ? '00' : minute);
      var labelPool = [correctLabel];
      var clockGuard = 0;
      while (labelPool.length < 4 && clockGuard < 40){
        clockGuard++;
        var dh = hour + rand(-3, 3);
        if (dh < 1) dh += 12;
        if (dh > 12) dh -= 12;
        var dm = minuteChoices[rand(0, minuteChoices.length - 1)];
        var lbl = dh + 'h' + (dm === 0 ? '00' : dm);
        if (labelPool.indexOf(lbl) === -1) labelPool.push(lbl);
      }
      return {
        kind:'clock', hour:hour, minute:minute, answer:correctLabel,
        choices:shuffle(labelPool),
        label:'Quelle heure est-il ?'
      };
    }
    if (mode === 'sequence'){
      var step = rand(1, tier([2, 2, 3, 4, 5]));
      var startNum = rand(0, Math.max(1, mx));
      var seq = [startNum, startNum + step, startNum + step * 2, startNum + step * 3];
      var nextNum = startNum + step * 4;
      var choicesSeq = buildNumberChoices(nextNum, 0, nextNum + 8);
      return {
        kind:'sequence', seq:seq, answer:nextNum, choices:choicesSeq,
        label:'Quel nombre vient juste après ?'
      };
    }
    if (mode === 'mystery'){
      var p = rand(1, mx), q = rand(1, mx);
      var total = p + q;
      var hideFirst = Math.random() < 0.5;
      var missing = hideFirst ? p : q;
      var known = hideFirst ? q : p;
      var choices5 = buildNumberChoices(missing, 0, total);
      return {
        kind:'mystery', known:known, total:total, missing:missing, hideFirst:hideFirst,
        answer:missing, choices:choices5,
        label:'Quel nombre manque-t-il ?'
      };
    }
  }

  function buildNumberChoices(correct, min, max){
    var pool = [correct];
    var guardCount = 0;
    while (pool.length < 4 && guardCount < 60){
      guardCount++;
      var delta = rand(-3, 3);
      var candidate = correct + delta;
      if (candidate < Math.max(0, min)) candidate = candidate + rand(1,3) + 1;
      if (candidate > max + 3) candidate = correct - rand(1,3);
      if (candidate < 0) candidate = rand(0, max);
      if (pool.indexOf(candidate) === -1){
        pool.push(candidate);
      }
    }
    while (pool.length < 4){
      var fallback = rand(Math.max(0,min), max + 4);
      if (pool.indexOf(fallback) === -1) pool.push(fallback);
    }
    return shuffle(pool);
  }

  // keep the two comparison groups visually distinct but stable per question
  var compareSetsCache = null;
  function pickSetStable(q, idx){
    if (!compareSetsCache || compareSetsCache.q !== q){
      compareSetsCache = { q: q, sets: [pickSet()[0], pickSet()[0]] };
    }
    return compareSetsCache.sets[idx];
  }

  function onAnswer(btn, q){
    if (state.locked) return;
    state.locked = true;
    clearTimer();
    var val = btn ? btn.getAttribute('data-val') : null;
    var correctVal = String(q.answer);
    var isCorrect = (val === correctVal);
    if (q && q.kind){
      progress.modeStats = progress.modeStats || {};
      var stR = progress.modeStats[q.kind] || (progress.modeStats[q.kind] = { ok:0, ko:0 });
      if (isCorrect) stR.ok++; else stR.ko++;
      var nowT = Date.now(), dk = todayKey();
      progress.days = progress.days || {}; progress.modeLevel = progress.modeLevel || {};
      var dd = progress.days[dk] || (progress.days[dk] = { ok:0, ko:0, secs:0 });
      if (isCorrect) dd.ok++; else dd.ko++;
      dd.secs += (window.__lastAnsT && nowT - window.__lastAnsT < 120000) ? Math.min(nowT - window.__lastAnsT, 45000) / 1000 : 12;
      window.__lastAnsT = nowT;
      progress.maxLevel = Math.max(progress.maxLevel || 0, state.difficulty);
      progress.modeLevel[q.kind] = Math.max(progress.modeLevel[q.kind] || 0, state.difficulty);
      saveProgress(progress);
    }
    var allBtns = stage.querySelectorAll('.choice-btn');
    var feedback = document.getElementById('feedbackLine');
    var mascot = document.getElementById('mascot');

    Array.prototype.forEach.call(allBtns, function(b){ b.disabled = true; });

    if (isCorrect){
      btn.classList.add('correct');
      state.score += 10 + state.streak;
      state.streak += 1;
      state.roundCorrect += 1;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      var leveledUp = false;
      if (state.streak > 0 && state.streak % 5 === 0 && state.difficulty < MAX_DIFFICULTY){
        state.difficulty += 1;
        leveledUp = true;
      }
      feedback.textContent = leveledUp ? '🎉 Niveau ' + state.difficulty + ' débloqué !' : pickPraise();
      feedback.className = 'feedback-line ok';
      mascot.className = 'mascot happy';
      launchConfetti();
      if (leveledUp) launchConfetti();
      playCorrectSound();
      var liveLevelTag = document.querySelector('.level-tag');
      if (liveLevelTag){
        liveLevelTag.textContent = levelLabel();
        if (leveledUp){
          liveLevelTag.classList.add('level-bump');
          setTimeout(function(){ liveLevelTag.classList.remove('level-bump'); }, 650);
        }
      }
    } else {
      if (btn) btn.classList.add('wrong');
      Array.prototype.forEach.call(allBtns, function(b){
        if (b.getAttribute('data-val') === correctVal) b.classList.add('correct');
      });
      state.streak = 0;
      feedback.textContent = val === null
        ? 'Temps écoulé ! La bonne réponse était ' + correctVal + '.'
        : 'Presque ! La bonne réponse était ' + correctVal + '.';
      feedback.className = 'feedback-line no';
      mascot.className = 'mascot sad';
      playWrongSound();
    }
    updateHud();
    updateProgressAfterAnswer(isCorrect);

    setTimeout(function(){
      if (state.roundIndex >= state.roundLength){
        clearTimer();
        renderResults();
      } else {
        nextQuestion();
      }
    }, 1000);
  }

  function clearTimer(){
    if (state.timerId){
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  function startTimer(q){
    clearTimer();
    state.timeLeft = QUESTION_SECONDS;
    var fill = document.getElementById('timerFill');
    if (!fill) return;
    fill.style.width = '100%';
    fill.classList.remove('urgent');
    state.timerId = setInterval(function(){
      state.timeLeft -= 0.1;
      var pct = Math.max(0, (state.timeLeft / QUESTION_SECONDS) * 100);
      var liveFill = document.getElementById('timerFill');
      if (liveFill){
        liveFill.style.width = pct + '%';
        if (state.timeLeft <= QUESTION_SECONDS * 0.25) liveFill.classList.add('urgent');
      }
      if (state.timeLeft <= 0){
        clearTimer();
        if (!state.locked) onAnswer(null, q);
      }
    }, 100);
  }

  function pickPraise(){
    var lines = ['Bravo !', 'Super !', 'Génial !', 'Exact !', 'Tu assures !', 'Magnifique !'];
    return lines[rand(0, lines.length - 1)];

  function nextQuestion(){

        badgeBanner +
        '<input type="text" id="playerNameInput" class="name-input" placeholder="Ton prénom (pour le diplôme)" maxlength="24" value="' + (curProfile() ? esc(curProfile().first) : '') + '">' +
        '<div class="results-actions">' +
          '<button class="btn-primary" id="replayBtn">Rejouer</button>' +
          '<button class="btn-secondary" id="menuBtn">Autre jeu</button>' +
          '<button class="btn-secondary" id="printBtn">🖨️ Diplôme</button>' +
        '</div>' +
      '</div>';

    document.getElementById('replayBtn').addEventListener('click', function(){
      startMode(state.mode);
    });
    document.getElementById('menuBtn').addEventListener('click', renderMenu);
    document.getElementById('printBtn').addEventListener('click', function(){
      var nameField = document.getElementById('playerNameInput');
